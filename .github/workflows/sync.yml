name: Gemeinsamen Reisespeicher prüfen
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 7 21-30 9 *'
    - cron: '23 7 1-8 10 *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/check_sync.py
